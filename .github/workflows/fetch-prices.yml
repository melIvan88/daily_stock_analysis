name: fetch-prices
on:
  push:
    branches: [data-fetch]
    paths: [.github/workflows/fetch-prices.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install yfinance pandas
      - run: |
          mkdir -p prices
          python - <<'PY'
          import yfinance as yf
          for t in ["QQQ","TQQQ","SPY","^NDX"]:
              df=yf.download(t,start="1985-01-01",auto_adjust=False,progress=False,multi_level_index=False)
              df.to_csv(f"prices/{t.replace('^','')}.csv"); print(t,len(df),df.index[0].date(),df.index[-1].date())
          PY
      - run: |
          git config user.name "price-bot"; git config user.email "price-bot@users.noreply.github.com"
          git add prices && git commit -m "Add daily price history (QQQ, TQQQ, SPY, NDX)" && git push
